# dsh-ssh-shell bundle patch: insert the plugin row.
# Applied after the dsh-base/dsh-web-app layers; the profile's own
# cordis.patch.yml can still override this row's config by id.
#
# `name` is the bare package name, not a path: the loader resolves a
# non-relative specifier as a package, which is how `dsh plugin add` finds it
# after installing the bundle. A './plugins/...' path would only work in a
# checkout that happens to sit at that exact location.

- insert:
    - id: ssh-shell
      name: dsh-ssh-shell
      config:
        # Where to keep ControlMaster sockets. Empty = ~/.dsh/ssh-shell, which
        # is used instead of $TMPDIR because the macOS temp path is long enough
        # that the socket path would exceed the ~104-byte sun_path limit once
        # ssh appends its own suffix.
        controlDir: ""
        # Default per-command timeout in ms (only when not given per-call).
        timeoutMs: 30000
        # ControlPersist value for the master ssh. "yes" (default) keeps the
        # master alive until it dies on its own, so an idle terminal never loses
        # the session and never asks for the password again. Set a number of
        # seconds to reap the master after that much inactivity.
        controlPersistSeconds: ""
        # Install the bundled skill (skills/ssh-shell/SKILL.md) into
        # $DSH_HOME/skills on startup, so installing the plugin also teaches the
        # agent that a GUI-panel session exists. Set false to manage skills
        # yourself.
        installSkill: true
